# Typechecking for the Growhelper integration.
#
# Home Assistant's modules are followed but silenced (follow_imports=silent):
# their types are needed to understand HA's APIs (e.g. ConfigFlow's `domain`
# class keyword), but HA's own code is not this repo's code and its internal
# errors are not reported here.
[mypy]
python_version = 3.14
ignore_missing_imports = True
follow_imports = silent
explicit_package_bases = True
